<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c10" />
  <title>Claudio</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=DotGothic16&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="tabs">
    <div class="tabs__group">
      <button class="tab active" data-view="player">Player</button>
      <button class="tab" data-view="profile">Profile</button>
      <button class="tab" data-view="settings">Settings</button>
    </div>
    <div class="status" id="status" data-state="connecting">connecting</div>
  </nav>

  <main>
    <!-- Player -->
    <section class="view active" data-view="player">
      <div class="player-grid">
        <div class="player-col">
          <div class="clock-card">
            <div class="clock-card__header">
              <div class="brand">Claudio</div>
            </div>
            <div class="clock-time" id="clock-time">--:--</div>
            <div class="clock-day" id="clock-day">—</div>
            <div class="clock-date" id="clock-date">—</div>
            <div class="onair"><span class="dot"></span> ON&nbsp;AIR</div>
          </div>

          <div class="player">
            <div class="player__top">
              <div class="player__eq" aria-hidden="true">
                <i></i><i></i><i></i><i></i>
              </div>
              <div class="player__meta">
                <div class="player__title" id="now-title">—</div>
                <div class="player__sub" id="now-sub"><span id="player-state">IDLE</span></div>
              </div>
              <div class="player__transport">
                <button id="btn-prev"  title="上一首">⏮</button>
                <button id="btn-play"  title="播放/暂停">▶</button>
                <button id="btn-next"  title="下一首">⏭</button>
                <button id="btn-stop"  title="停止">■</button>
              </div>
              <div class="player__vol">
                <span class="muted">VOL</span>
                <input type="range" id="vol" min="0" max="100" value="80" />
              </div>
            </div>
            <div class="player__progress">
              <span id="cur-time">0:00</span>
              <div class="bar" id="progress-bar"><div class="bar__fill" id="progress-fill"></div></div>
              <span id="dur-time">0:00</span>
            </div>
          </div>

          <audio id="audio" preload="none" hidden></audio>

          <div class="card">
            <div class="card__label">
              <span>QUEUE</span>
              <span class="card__count" id="queue-count">0 TRACKS</span>
            </div>
            <ol id="queue" class="queue"></ol>
          </div>
        </div>

        <div class="chat-col">
          <div class="card chat">
            <div class="card__label">
              <span class="brand-dot"></span>
              Claudio
              <span class="eq-mini" id="eq-mini" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </div>
            <div id="chat-log" class="chat__log" aria-live="polite"></div>
            <form id="chat-form" class="chat__form">
              <input id="chat-input" type="text" placeholder="Say something to the DJ..." autocomplete="off" />
              <button type="submit" title="发送">↑</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- Profile -->
    <section class="view" data-view="profile">
      <div class="card">
        <div class="card__label">用户品味语料</div>
        <div id="taste" class="taste">loading…</div>
      </div>
      <div class="card">
        <div class="card__label">今日计划</div>
        <pre id="plan" class="plan">none</pre>
      </div>
    </section>

    <!-- Settings -->
    <section class="view" data-view="settings">
      <div class="card">
        <div class="card__label">网易云账号</div>
        <div id="ncm-login">
          <p class="muted" id="ncm-state">查询中…</p>
          <div id="ncm-qr-wrap" hidden>
            <img id="ncm-qr" alt="QR" />
            <p class="muted" id="ncm-qr-status">…</p>
          </div>
          <div class="row">
            <button id="ncm-login-btn" type="button">登录网易云</button>
            <button id="ncm-logout-btn" type="button" hidden>退出</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card__label">连接</div>
        <dl class="kv">
          <dt>server</dt>     <dd id="set-server">—</dd>
          <dt>websocket</dt>  <dd id="set-ws">—</dd>
          <dt>uptime</dt>     <dd id="set-uptime">—</dd>
        </dl>
      </div>
      <div class="card">
        <div class="card__label">关于</div>
        <p class="muted">Claudio · 个人 AI 电台 · v0.1.0</p>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
